plugins {
    id 'architectury-plugin'
    id 'dev.architectury.loom'
}

architectury { fabric() }

loom {
    accessWidenerPath = project(':common').file('src/main/resources/rtbridge.accesswidener')
}

configurations { developmentFabric.extendsFrom implementation }

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    implementation project(path: ':common', configuration: 'namedElements')

    // Sable Companion — JiJ 进 jar，软依赖 Sable 本体
    include(modApi("dev.ryanhcode.sable-companion:sable-companion-fabric:${project.sable_companion_version}"))
}
