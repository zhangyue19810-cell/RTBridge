plugins {
    id 'net.neoforged.gradle.userdev' version '7.0.157'
}

version = project.mod_version
group   = project.maven_group
base { archivesName = project.archives_base_name }

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

dependencies {
    implementation "net.neoforged:neoforge:${project.neo_version}"

    // Sable Companion — lightweight, JiJ into our mod
    jarJar(api("dev.ryanhcode.sable-companion:sable-companion-common-${project.minecraft_version}:[${project.sable_companion_version},)")) {
        version { prefer project.sable_companion_version }
    }
}
