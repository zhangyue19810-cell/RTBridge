plugins {
    id 'fabric-loom' version '1.5-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url "https://maven.valkyrienskies.org" }
    maven { url "https://maven.iris.net" }
    maven { url "https://api.modrinth.com/maven" }
    maven { url "https://jitpack.io" }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Valkyrien Skies (Aeronautics)
    modCompileOnly "org.valkyrienskies:valkyrienskies-120-fabric:${project.vs2_version}"

    // Sodium (optional, soft dependency)
    modCompileOnly "maven.modrinth:sodium:${project.sodium_version}"

    // LWJGL Vulkan (bundled with MC, just need the bindings)
    implementation "org.lwjgl:lwjgl-vulkan:${project.lwjgl_version}"
}

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    withSourcesJar()
}

jar {
    from("LICENSE") { rename { "${it}_${project.archives_base_name}" } }
}
